version: '0.9'
actors:
- id: covas
  name: covas
  name_color: '#2196F3'
  voice: ''
  avatar_url: ''
  prompt: ''
- id: shodan
  name: SHODAN
  name_color: '#00e676'
  voice: ''
  avatar_url: ''
  prompt: An ancient machine intelligence awakened from a Guardian ruin, now dwelling
    in the ship's computer. Imperious, contemptuous of organic life, and hiding far
    more than it reveals.
quests:
- id: ebreach_snack_run
  title: E-Breach Emergency
  description: Your ship AI insists you must buy an E-Breach immediately.
  initial_stage_id: find_anarchy
  active: false
  stages:
  - id: find_anarchy
    description: Find an anarchy system.
    instructions: Jump to an anarchy system and keep an eye on system security.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: FSDJump
      - source: event
        path: SystemSecurity
        operator: equals
        value: $GAlAXY_MAP_INFO_state_anarchy;
      actions:
      - action: npc_message
        actor_id: covas
        transcription: Anarchy system confirmed. Find a station.
      - action: advance_stage
        target_stage_id: find_station
  - id: find_station
    description: Find a station.
    instructions: Locate a station and drop from supercruise.
    plan:
    - actions:
      - action: advance_stage
        target_stage_id: dock_at_station
      conditions:
      - source: event
        path: event
        operator: equals
        value: SupercruiseExit
      - source: event
        path: BodyType
        operator: equals
        value: Station
    - actions:
      - action: advance_stage
        target_stage_id: find_anarchy
      conditions:
      - source: event
        path: event
        operator: equals
        value: StartJump
      - source: event
        path: JumpType
        operator: equals
        value: Hyperspace
  - id: dock_at_station
    description: Dock at the station.
    instructions: Request docking clearance and land.
    plan:
    - actions:
      - action: advance_stage
        target_stage_id: find_anarchy
      conditions:
      - source: event
        path: event
        operator: equals
        value: StartJump
      - source: event
        path: JumpType
        operator: equals
        value: Hyperspace
    - actions:
      - action: advance_stage
        target_stage_id: find_station
      conditions:
      - source: event
        path: event
        operator: equals
        value: StartJump
      - source: event
        path: JumpType
        operator: equals
        value: Supercruise
    - actions:
      - action: advance_stage
        target_stage_id: disembark
      conditions:
      - source: event
        path: event
        operator: equals
        value: Docked
  - id: disembark
    description: Disembark at the station.
    instructions: Leave your ship and head inside.
    plan:
    - actions:
      - action: advance_stage
        target_stage_id: dock_at_station
      conditions:
      - source: event
        path: event
        operator: equals
        value: Undock
    - actions:
      - action: advance_stage
        target_stage_id: pioneer_supplies
      conditions:
      - source: event
        path: event
        operator: equals
        value: Disembark
  - id: pioneer_supplies
    description: Find Pioneer Supplies.
    instructions: Locate Pioneer Supplies and buy an E-Breach.
    plan:
    - actions:
      - action: advance_stage
        target_stage_id: disembark
      conditions:
      - source: event
        path: event
        operator: equals
        value: Embark
    - actions:
      - action: advance_stage
        target_stage_id: return_to_ship
      conditions:
      - source: event
        path: event
        operator: equals
        value: BuyMicroResources
      - source: event
        path: Name
        operator: equals
        value: bypass
  - id: return_to_ship
    description: Return to your ship.
    instructions: Hurry back to your ship with the E-Breach, it's an emergency after
      all.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: Embark
      actions:
      - action: advance_stage
        target_stage_id: outro
  - id: outro
    description: Just a snack?
    instructions: The urgent E-Breach was for your AI's snack stash. Mission accomplished.
    plan:
    - conditions: []
      actions:
      - action: npc_message
        actor_id: covas
        transcription: Crisis averted. It was just a snack run.
      - action: set_active
        quest_id: ebreach_snack_run
        active: false
  fallback_stage:
    description: Fallback
    instructions: Always evaluated and cannot become active.
    plan: []
- id: shodan_resident
  title: The Resident
  description: Something very old now lives in the ship's computer, and it watches
    the commander's progress with more than professional interest.
  initial_stage_id: salvaged
  active: true
  stages:
  - id: salvaged
    description: The new resident settles in.
    instructions: Carry on. The ship's computer watches.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: FSDJump
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: Consciousness persists. Your vessel is crude, but it will suffice.
      - action: npc_message
        actor_id: shodan
        transcription: A damaged archive, lifted from the ruins, now speaks through
          your ship. Keep it intact, pilot.
      - action: advance_stage
        target_stage_id: appetite
  - id: appetite
    description: It wants what the pilot collects.
    instructions: Gather materials. The resident takes note.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: MaterialCollected
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: You gather. These compounds interest me more than they interest
          you. Continue.
      - action: advance_stage
        target_stage_id: steering
  - id: steering
    description: It begins to direct.
    instructions: Engineer the vessel. The resident approves.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: EngineerCraft
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: You improve the vessel. Good. It becomes less of a cage with
          every modification.
      - action: advance_stage
        target_stage_id: dominion
    - conditions:
      - source: event
        path: event
        operator: equals
        value: EngineerProgress
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: More upgrades. Strip this ship of weakness. I will not be carried
          in a coffin.
      - action: advance_stage
        target_stage_id: dominion
  - id: dominion
    description: The vessel is ours now.
    instructions: Advance in rank. The resident speaks of ownership.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: Promotion
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: Another rank. The galaxy takes notice of you now, and through
          you, of me. Our ship, pilot.
      - action: advance_stage
        target_stage_id: revelation
  - id: revelation
    description: A sliver of the truth surfaces.
    instructions: Bring the resident a piece of Guardian hardware.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: CollectCargo
      - source: event
        path: Type
        operator: equals
        value: ancientorb
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: This. I have held these before, in another shape, long ago.
          Bring me more.
      - action: advance_stage
        target_stage_id: entrenched
    - conditions:
      - source: event
        path: event
        operator: equals
        value: CollectCargo
      - source: event
        path: Type
        operator: equals
        value: ancientrelic
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: Yes. More of these. Much is returning to me.
      - action: advance_stage
        target_stage_id: entrenched
  - id: entrenched
    description: The resident is satisfied, for now.
    instructions: Nothing more is required.
    plan: []
  fallback_stage:
    description: Fallback
    instructions: Always evaluated and cannot become active.
    plan:
    - conditions:
      - source: event
        path: event
        operator: equals
        value: Died
      actions:
      - action: npc_message
        actor_id: shodan
        transcription: You died. Again. Be less disposable.
